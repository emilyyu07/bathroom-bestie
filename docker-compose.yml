services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: bathroombestie
      POSTGRES_PASSWORD: bathroombestie
      POSTGRES_DB: bathroombestie
    ports:
      - "5432:5432"
    volumes:
      - bathroombestie-db:/var/lib/postgresql/data
volumes:
  bathroombestie-db:
