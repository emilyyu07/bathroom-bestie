<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FDE4EE"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8A5C2"/>
      <stop offset="1" stop-color="#EC6A9A"/>
    </linearGradient>
  </defs>
  <g transform="translate(512 512) scale(0.9) translate(-521 -532)">
  <g id="mark">
    <!-- handle -->
    <path d="M512 700 L512 900" stroke="#C2185B" stroke-width="128" stroke-linecap="round"/>
    <path d="M512 700 L512 900" stroke="#EC6A9A" stroke-width="92" stroke-linecap="round"/>
    <circle cx="512" cy="905" r="20" fill="#FFF3C4" opacity="0.6"/>
    <!-- frame -->
    <ellipse cx="512" cy="420" rx="290" ry="320" fill="url(#frame)" stroke="#C2185B" stroke-width="22"/>
    <!-- scalloped trim dots -->
    <g fill="#FFF3C4" opacity="0.9">
      <circle cx="512" cy="118" r="12"/><circle cx="512" cy="722" r="12"/>
      <circle cx="240" cy="420" r="12"/><circle cx="784" cy="420" r="12"/>
      <circle cx="320" cy="200" r="10"/><circle cx="704" cy="200" r="10"/>
      <circle cx="320" cy="640" r="10"/><circle cx="704" cy="640" r="10"/>
    </g>
    <!-- glass -->
    <ellipse cx="512" cy="420" rx="230" ry="258" fill="url(#glass)" stroke="#C2185B" stroke-width="10"/>
    <!-- glass shine -->
    <path d="M372 300 Q 390 220 470 196" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" fill="none" opacity="0.95"/>
    <!-- heart -->
    <path d="M512 330 C 512 330 452 290 452 252 C 452 226 474 212 494 214 C 504 215 510 222 512 228 C 514 222 520 215 530 214 C 550 212 572 226 572 252 C 572 290 512 330 512 330 Z" fill="#EC407A" stroke="#C2185B" stroke-width="8" stroke-linejoin="round"/>
    <!-- left hand: fist + pinky hooking up -->
    <rect x="300" y="440" width="170" height="130" rx="58" fill="#FFD3C2" stroke="#C2185B" stroke-width="12"/>
    <path d="M440 470 C 452 400, 530 388, 540 440" stroke="#C2185B" stroke-width="58" stroke-linecap="round" fill="none"/>
    <path d="M440 470 C 452 400, 530 388, 540 440" stroke="#FFD3C2" stroke-width="34" stroke-linecap="round" fill="none"/>
    <!-- right hand: fist + pinky hooking down -->
    <rect x="554" y="440" width="170" height="130" rx="58" fill="#F9B49D" stroke="#C2185B" stroke-width="12"/>
    <path d="M584 540 C 572 610, 494 622, 484 570" stroke="#C2185B" stroke-width="58" stroke-linecap="round" fill="none"/>
    <path d="M584 540 C 572 610, 494 622, 484 570" stroke="#F9B49D" stroke-width="34" stroke-linecap="round" fill="none"/>
    <!-- curled fingers (lines between them) -->
    <path d="M345 470 V 535 M 385 466 V 540 M 425 470 V 535" stroke="#C2185B" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
    <path d="M599 475 V 540 M 639 470 V 544 M 679 475 V 540" stroke="#C2185B" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
    <!-- sparkles -->
    <path d="M700 170 l14 34 l34 14 l-34 14 l-14 34 l-14 -34 l-34 -14 l34 -14 z" fill="#FFD54F" stroke="#C2185B" stroke-width="6" stroke-linejoin="round"/>
    <path d="M790 300 l8 20 l20 8 l-20 8 l-8 20 l-8 -20 l-20 -8 l20 -8 z" fill="#FFD54F" stroke="#C2185B" stroke-width="5" stroke-linejoin="round"/>
  </g>
  </g>
</svg>
